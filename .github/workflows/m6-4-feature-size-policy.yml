name: M6.4 feature size policy

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: m6-4-size-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feature-size-policy:
    name: Feature size policy
    runs-on: macos-15
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run additive feature size budget contract
        run: (cd scripts && python3 -m unittest -v test_feature_size_budget.py)

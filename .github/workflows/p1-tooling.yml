name: P1 Tooling

on:
  pull_request:
    paths:
      - scripts/p1_target_resource_evidence.py
      - scripts/test_p1_target_resource_evidence.py
      - scripts/test_p1_target_platform_family.py
      - .github/workflows/p1-tooling.yml
  push:
    branches: [main]
    paths:
      - scripts/p1_target_resource_evidence.py
      - scripts/test_p1_target_resource_evidence.py
      - scripts/test_p1_target_platform_family.py
      - .github/workflows/p1-tooling.yml

permissions:
  contents: read

concurrency:
  group: p1-tooling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p1-evidence-tests:
    name: P1 evidence validator
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report Python
        run: python3 --version

      - name: Test P1 evidence validator
        run: >-
          (cd scripts && python3 -m unittest -v
          test_p1_target_resource_evidence.py
          test_p1_target_platform_family.py)

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-26-compatibility:
    name: macOS 26 compatibility
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report platform
        run: |
          sw_vers
          xcode-select -p
          swift --version

      - name: Build with warnings as errors
        run: swift build -Xswiftc -warnings-as-errors

      - name: Build media bridge probe CLI with warnings as errors
        run: swift build --product MediaBridgeProbe -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test --parallel

      - name: Build and verify media bridge probe candidate
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          bash scripts/build-media-bridge-probe-app.sh
          bash scripts/verify-media-bridge-probe.sh

          build/MediaBridgeProbe.app/Contents/MacOS/MediaBridgeProbe capabilities \
            > build/media-bridge-capabilities.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('build/media-bridge-capabilities.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          expected_keys = {'next', 'previous', 'seek'}
          allowed_values = {'supported', 'unsupported', 'unknown'}
          if set(data) != expected_keys:
              raise SystemExit(f'Unexpected capability keys: {sorted(data)}')
          invalid = {key: value for key, value in data.items() if value not in allowed_values}
          if invalid:
              raise SystemExit(f'Unexpected capability values: {invalid!r}')
          PY
          cat build/media-bridge-capabilities.json

          build/MediaBridgeProbe.app/Contents/MacOS/MediaBridgeProbe observe --seconds 1 \
            > build/media-bridge-observation.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('build/media-bridge-observation.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          if data.get('schemaVersion') != 2:
              raise SystemExit(f'Unexpected observation schema version: {data!r}')
          if not isinstance(data.get('observedSessionDisappearance'), bool):
              raise SystemExit('Missing boolean observedSessionDisappearance')
          switch_count = data.get('sourceSwitchCount')
          if not isinstance(switch_count, int) or switch_count < 0:
              raise SystemExit(f'Invalid sourceSwitchCount: {switch_count!r}')
          forbidden_keys = {'title', 'artist', 'album', 'artworkData', 'rawPayload'}
          leaked = forbidden_keys.intersection(data)
          if leaked:
              raise SystemExit(f'Unexpected metadata keys in observation report: {sorted(leaked)}')
          PY
          cat build/media-bridge-observation.json

          rm -f build/MediaBridgeProbe.zip
          ditto -c -k --sequesterRsrc --keepParent \
            build/MediaBridgeProbe.app \
            build/MediaBridgeProbe.zip

      - name: Verify archived media bridge probe candidate
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          readonly ROUNDTRIP_ROOT="build/media-bridge-probe-archive-roundtrip"
          readonly APP="$ROUNDTRIP_ROOT/MediaBridgeProbe.app"
          readonly PATCH_FILE="Tools/MediaBridgeProbe/patches/mediaremote-adapter-capabilities.patch"
          readonly PATCH_SHA256="$(shasum -a 256 "$PATCH_FILE" | awk '{print $1}')"

          rm -rf "$ROUNDTRIP_ROOT"
          mkdir -p "$ROUNDTRIP_ROOT"
          ditto -x -k build/MediaBridgeProbe.zip "$ROUNDTRIP_ROOT"

          test -x "$APP/Contents/MacOS/MediaBridgeProbe"
          test "$(plutil -extract ProbeSourceCommit raw "$APP/Contents/Info.plist")" = "$SOURCE_COMMIT"
          test "$(plutil -extract ProbeAdapterCommit raw "$APP/Contents/Info.plist")" = \
            "3ac3d4bdf862c7b5399b4fba4df5689f5c38609a"
          test "$(plutil -extract ProbeAdapterPatchSHA256 raw "$APP/Contents/Info.plist")" = \
            "$PATCH_SHA256"

          codesign --verify --deep --strict "$APP"
          codesign -dv --verbose=4 "$APP" 2> build/media-probe-archive-codesign.txt
          grep -Eq 'flags=.*runtime' build/media-probe-archive-codesign.txt

          codesign --display --entitlements - --xml "$APP" \
            > build/media-probe-archive-entitlements.plist
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          with Path('build/media-probe-archive-entitlements.plist').open('rb') as handle:
              entitlements = plistlib.load(handle)

          expected = {'com.apple.security.app-sandbox': True}
          if entitlements != expected:
              raise SystemExit(f'Unexpected probe archive entitlements: {entitlements!r}')
          PY

      - name: Upload media bridge probe candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MediaBridgeProbe-candidate
          path: build/MediaBridgeProbe.zip
          if-no-files-found: error

      - name: Build production media transport candidate
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          bash scripts/build-production-media-transport-candidate.sh
          bash scripts/verify-production-media-transport-candidate.sh

          build/ProductionMediaTransportCandidate.app/Contents/MacOS/MediaTransportCandidate capabilities \
            > build/production-media-transport-capabilities.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('build/production-media-transport-capabilities.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          expected_keys = {'next', 'previous', 'seek'}
          allowed_values = {'supported', 'unsupported', 'unknown'}
          if set(data) != expected_keys:
              raise SystemExit(f'Unexpected production capability keys: {sorted(data)}')
          invalid = {key: value for key, value in data.items() if value not in allowed_values}
          if invalid:
              raise SystemExit(f'Unexpected production capability values: {invalid!r}')
          PY
          cat build/production-media-transport-capabilities.json

          build/ProductionMediaTransportCandidate.app/Contents/MacOS/MediaTransportCandidate observe --seconds 1 \
            > build/production-media-transport-observation.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('build/production-media-transport-observation.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          required = {
              'schemaVersion', 'sourceCommit', 'adapterCommit', 'eventCount',
              'observedSession', 'observedArtwork', 'observedPlayingState',
              'observedSessionDisappearance', 'observedArtworkClearOnSourceSwitch',
              'sourceSwitchCount', 'sourceBundleIdentifier', 'capabilities', 'cleanTeardown'
          }
          if set(data) != required:
              raise SystemExit(f'Unexpected production observation keys: {sorted(data)}')
          if data['schemaVersion'] != 1:
              raise SystemExit(f'Unexpected production observation schema: {data!r}')
          for key in (
              'observedSession', 'observedArtwork', 'observedPlayingState',
              'observedSessionDisappearance', 'observedArtworkClearOnSourceSwitch', 'cleanTeardown'
          ):
              if not isinstance(data.get(key), bool):
                  raise SystemExit(f'Missing boolean {key}')
          for key in ('eventCount', 'sourceSwitchCount'):
              if not isinstance(data.get(key), int) or data[key] < 0:
                  raise SystemExit(f'Invalid {key}: {data.get(key)!r}')
          if data['sourceCommit'] != '${{ github.event.pull_request.head.sha || github.sha }}':
              raise SystemExit('Production observation source provenance mismatch')
          if data['adapterCommit'] != '3ac3d4bdf862c7b5399b4fba4df5689f5c38609a':
              raise SystemExit('Production observation adapter provenance mismatch')
          capabilities = data.get('capabilities')
          allowed_values = {'supported', 'unsupported', 'unknown'}
          if not isinstance(capabilities, dict) or set(capabilities) != {'previous', 'next', 'seek'}:
              raise SystemExit(f'Invalid production capabilities: {capabilities!r}')
          if any(value not in allowed_values for value in capabilities.values()):
              raise SystemExit(f'Invalid production capability state: {capabilities!r}')
          forbidden_keys = {
              'title', 'artist', 'album', 'artworkData', 'rawPayload',
              'contentIdentifier', 'uniqueIdentifier', 'positionSeconds', 'durationSeconds'
          }
          leaked = forbidden_keys.intersection(data)
          if leaked:
              raise SystemExit(f'Unexpected private keys in production observation: {sorted(leaked)}')
          PY
          cat build/production-media-transport-observation.json

          rm -f build/ProductionMediaTransportCandidate.zip
          ditto -c -k --sequesterRsrc --keepParent \
            build/ProductionMediaTransportCandidate.app \
            build/ProductionMediaTransportCandidate.zip

      - name: Verify archived production media transport candidate
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          readonly ROUNDTRIP_ROOT="build/production-media-transport-archive-roundtrip"
          rm -rf "$ROUNDTRIP_ROOT"
          mkdir -p "$ROUNDTRIP_ROOT"
          ditto -x -k build/ProductionMediaTransportCandidate.zip "$ROUNDTRIP_ROOT"
          APP="$ROUNDTRIP_ROOT/ProductionMediaTransportCandidate.app" \
            bash scripts/verify-production-media-transport-candidate.sh

      - name: Upload production media transport candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ProductionMediaTransportCandidate-candidate
          path: build/ProductionMediaTransportCandidate.zip
          if-no-files-found: error

  build-test-package:
    name: Build, test and package
    needs: macos-26-compatibility
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sw_vers
          xcode-select -p
          swift --version

      - name: Validate package
        run: swift package describe

      - name: Release policy tests
        run: (cd scripts && python3 -m unittest -v test_release_policy.py)

      - name: Performance policy tests
        run: (cd scripts && python3 -m unittest -v test_performance_policy.py)

      - name: Media bridge probe policy tests
        run: >-
          (cd scripts && python3 -m unittest -v
          test_media_bridge_probe_acceptance.py
          test_media_bridge_probe_ci.py)

      - name: Performance policy audit
        run: python3 scripts/performance_policy.py audit Sources

      - name: Validate sources, scripts and security baseline
        run: |
          swift format lint --recursive --strict --configuration .swift-format Sources Tools Tests Package.swift
          plutil -lint Resources/Info.plist Resources/NotchHub.entitlements Resources/ProductionMediaTransportCandidate.entitlements
          bash -n scripts/*.sh
          ./scripts/security-audit.sh

      - name: Build debug with warnings as errors
        run: swift build -Xswiftc -warnings-as-errors

      - name: Build media bridge probe CLI with warnings as errors
        run: swift build --product MediaBridgeProbe -Xswiftc -warnings-as-errors

      - name: Test with coverage instrumentation
        run: swift test --parallel --enable-code-coverage

      - name: Build release DMG
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build-dmg.sh

      - name: Verify bundle, hardened runtime, sandbox and DMG
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          APP="build/NotchHub.app"
          EXECUTABLE="$APP/Contents/MacOS/NotchHub"

          test -x "$EXECUTABLE"
          test -f "$APP/Contents/Info.plist"
          test -f build/NotchHub.dmg
          test "$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")" = "$VERSION"
          test "$(plutil -extract CFBundleVersion raw "$APP/Contents/Info.plist")" = "${{ github.run_number }}"
          test "$(plutil -extract CFBundleIdentifier raw "$APP/Contents/Info.plist")" = "ru.trueruslan.notchhub"

          codesign --verify --deep --strict "$APP"
          codesign -dv --verbose=4 "$APP" 2> build/codesign-details.txt
          cat build/codesign-details.txt
          grep -Eq 'flags=.*runtime' build/codesign-details.txt

          codesign --display --entitlements - --xml "$APP" | tee build/effective-entitlements.plist
          plutil -lint build/effective-entitlements.plist
          plutil -p build/effective-entitlements.plist
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          with Path('build/effective-entitlements.plist').open('rb') as handle:
              entitlements = plistlib.load(handle)

          expected = {'com.apple.security.app-sandbox': True}
          if entitlements != expected:
              raise SystemExit(f'Unexpected effective entitlements: {entitlements!r}')
          PY

          otool -L "$EXECUTABLE" | tail -n +2 | awk '{print $1}' | while read -r library; do
            case "$library" in
              /System/*|/usr/lib/*) ;;
              *) echo "Unexpected non-system dynamic library: $library" >&2; exit 1 ;;
            esac
          done

          hdiutil verify build/NotchHub.dmg

          if find "$APP" -type f \( -name 'perf-baseline.py' -o -name 'performance_policy.py' -o -name 'test_performance_policy.py' \) -print -quit | grep -q .; then
            echo "Development performance tooling was bundled into NotchHub.app" >&2
            exit 1
          fi

          if find "$APP" -type f \( \
            -name 'MediaBridgeProbe' -o \
            -name 'MediaTransportCandidate' -o \
            -name 'mediaremote-adapter.pl' -o \
            -name 'MediaRemoteAdapterTestClient' \
          \) -print -quit | grep -q .; then
            echo "Development media tooling was bundled into NotchHub.app" >&2
            exit 1
          fi
          if find "$APP" -type d -name 'MediaRemoteAdapter.framework' -print -quit | grep -q .; then
            echo "Development MediaRemoteAdapter.framework was bundled into NotchHub.app" >&2
            exit 1
          fi

      - name: Record deterministic artifact sizes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          app = Path('build/NotchHub.app')
          executable = app / 'Contents/MacOS/NotchHub'
          dmg = Path('build/NotchHub.dmg')
          data = {
              'schemaVersion': 1,
              'sourceCommit': '${{ github.event.pull_request.head.sha || github.sha }}',
              'executableSizeBytes': executable.stat().st_size,
              'appSizeBytes': sum(path.stat().st_size for path in app.rglob('*') if path.is_file()),
              'dmgSizeBytes': dmg.stat().st_size,
          }
          Path('build/perf-size.json').write_text(
              json.dumps(data, sort_keys=True, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          cat build/perf-size.json

      - name: Enforce release size budget
        run: |
          python3 scripts/performance_policy.py check-size-budget \
            --summary build/perf-size.json \
            --baseline performance/baseline-v0.1.0.json

      - name: Performance harness compatibility smoke
        run: |
          SOURCE_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          python3 scripts/perf-baseline.py \
            --app build/NotchHub.app \
            --source-commit "$SOURCE_SHA" \
            --scenario idle \
            --warmup-seconds 0 \
            --duration-seconds 5 \
            --interval-seconds 1 \
            --output build/perf-smoke.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('build/perf-smoke.json').read_text(encoding='utf-8'))
          required = {
              'schemaVersion', 'scenario', 'sourceCommit', 'measurementToolCommit',
              'platform', 'measurementMode', 'sampleIntervalSeconds', 'sampleCount', 'summary'
          }
          missing = required - set(data)
          if missing:
              raise SystemExit(f'Missing performance smoke keys: {sorted(missing)}')
          if data['schemaVersion'] != 1 or data['scenario'] != 'idle':
              raise SystemExit(f'Unexpected performance smoke schema: {data!r}')
          if data['sampleCount'] != 5:
              raise SystemExit(f'Expected 5 smoke samples, got {data["sampleCount"]!r}')
          summary = data['summary']
          for key in ('cpuMedianPercent', 'cpuMaxPercent', 'rssMedianKiB', 'rssMaxKiB', 'threadMedian', 'threadMax'):
              if key not in summary:
                  raise SystemExit(f'Missing summary key: {key}')
          PY
          cat build/perf-smoke.json

      - name: Upload performance metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NotchHub-performance-metadata
          path: |
            build/perf-size.json
            build/perf-smoke.json
          if-no-files-found: error

      - name: Upload DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NotchHub-dmg
          path: build/NotchHub.dmg
          if-no-files-found: error

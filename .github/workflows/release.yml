name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build release DMG
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate tag and sources
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          swift format lint --recursive --strict --configuration .swift-format Sources Tests Package.swift
          plutil -lint Resources/Info.plist
          bash -n scripts/*.sh

      - name: Test
        run: swift test --parallel --enable-code-coverage

      - name: Build DMG
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build-dmg.sh

      - name: Verify release artifact
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test "$(plutil -extract CFBundleShortVersionString raw build/NotchHub.app/Contents/Info.plist)" = "$VERSION"
          test "$(plutil -extract CFBundleVersion raw build/NotchHub.app/Contents/Info.plist)" = "${{ github.run_number }}"
          codesign --verify --deep --strict build/NotchHub.app
          hdiutil verify build/NotchHub.dmg

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/NotchHub.dmg --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/NotchHub.dmg \
              --title "NotchHub $GITHUB_REF_NAME" \
              --generate-notes
          fi

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build release DMG
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: swift test --parallel

      - name: Build DMG
        run: ./scripts/build-dmg.sh

      - name: Verify bundle
        run: codesign --verify --deep --strict build/NotchHub.app

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/NotchHub.dmg --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/NotchHub.dmg \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
